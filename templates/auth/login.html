{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VeriFace</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
</head>
<body>
<div class="auth-page">

    <div class="auth-hero">
        <div class="auth-hero-icon">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="auth-title fade-up">Welcome Back</div>
        <div class="auth-subtitle fade-up">your identity. your door.</div>
    </div>

    <div class="auth-body">
        <form method="POST" action="{% url 'login' %}"
              style="display: flex; flex-direction: column; gap: 14px;">
            {% csrf_token %}

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message error">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="form-group fade-up fade-up-1">
                <label class="form-label">Username</label>
                <input class="form-input" type="text"
                       name="username" placeholder="Enter your username"
                       autocomplete="username">
            </div>

            <div class="form-group fade-up fade-up-2">
                <label class="form-label">Password</label>
                <input class="form-input" type="password"
                       name="password" placeholder="Enter your password"
                       autocomplete="current-password">
            </div>

            <div class="fade-up fade-up-3" style="margin-top: 8px;">
                <button type="submit" class="btn btn-primary">
                    Sign In
                </button>
            </div>

            <div class="fade-up fade-up-4" style="text-align: center;">
                <span style="font-family: var(--font-mono); font-size: 0.75rem;
                             color: var(--text-muted);">
                    New user?
                    <a href="{% url 'verify_device' %}"
                       style="color: var(--accent);">Create Account</a>
                </span>
            </div>
        </form>
    </div>
</div>
</body>
</html>
