{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — VeriFace</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
</head>
<body>
<div class="auth-page">

    <div class="auth-hero">
        <div class="auth-hero-icon">
            <svg viewBox="0 0 24 24">
                <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
        </div>
        <div class="auth-title fade-up">Create Account</div>
        <div class="auth-subtitle fade-up">join your household</div>
    </div>

    <div class="auth-body">
        <form method="POST" style="display: flex; flex-direction: column; gap: 14px;">
            {% csrf_token %}

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message error">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="form-group fade-up fade-up-1">
                <label class="form-label">Username</label>
                <input class="form-input" type="text"
                       name="username" placeholder="Choose a username">
            </div>

            <div class="form-group fade-up fade-up-2">
                <label class="form-label">Email</label>
                <input class="form-input" type="email"
                       name="email" placeholder="your@email.com">
            </div>

            <div class="form-group fade-up fade-up-3">
                <label class="form-label">Password</label>
                <input class="form-input" type="password"
                       name="password" placeholder="Min. 8 characters">
            </div>

            <div class="fade-up fade-up-4" style="margin-top: 8px;">
                <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
