{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#080C12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VeriFace</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
</head>
<body>

<!-- Desktop block message -->
<div class="mobile-only-message">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5A7A94" stroke-width="1.5">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <circle cx="12" cy="17" r="1"/>
    </svg>
    <span>VERIFACE IS A MOBILE APP</span>
    <span style="color: #2A4060; font-size: 0.7rem;">Open on your phone or install as PWA</span>
</div>

<div class="app-shell">

    <!-- Camera Alert Banner -->
    <div class="alert-banner" id="camera-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span id="camera-alert-text">Camera alert</span>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-logo">VERI<span>FACE</span></div>
        <div class="header-user">
            <span class="header-username">{{ user.username }}</span>
            <a href="{% url 'user_profile' %}">
                {% if user.profile.face_image %}
                    <img class="header-avatar"
                         src="{{ user.profile.face_image.url }}"
                         alt="{{ user.username }}">
                {% else %}
                    <div class="header-avatar" style="background: var(--bg-elevated);"></div>
                {% endif %}
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="section">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Nav -->
    <footer class="footer">
        <nav class="nav-bar">
            <a href="{% url 'live_feed' %}"
               class="nav-item {% if active_page == 'live_feed' %}active{% endif %}">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M23 7l-7 5 7 5V7z"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                </div>
                <span class="nav-label">Feed</span>
            </a>
            <a href="{% url 'door_control' %}"
               class="nav-item {% if active_page == 'door_control' %}active{% endif %}">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-label">Door</span>
            </a>
            <a href="{% url 'qr_generator' %}"
               class="nav-item {% if active_page == 'qr_generator' %}active{% endif %}">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <rect x="14" y="14" width="3" height="3"/>
                    </svg>
                </div>
                <span class="nav-label">Guest</span>
            </a>
            <a href="{% url 'logs' %}"
               class="nav-item {% if active_page == 'logs' %}active{% endif %}">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </div>
                <span class="nav-label">Logs</span>
            </a>
        </nav>
    </footer>
</div>

<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ SW registered, scope:', reg.scope))
            .catch(e => console.log('❌ SW failed:', e));
    }
</script>

</body>
</html>
